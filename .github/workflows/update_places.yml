name: judo weekly curation

on:
  schedule:
    # 매주 월요일 오전 9시 KST = 일요일 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      category:
        description: "특정 카테고리만 실행하고 싶으면 입력"
        required: false
        type: string

jobs:
  curate:
    runs-on: ubuntu-latest

    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INPUT_CATEGORY: ${{ inputs.category }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai supabase

      - name: Sanity check env
        run: |
          python - <<'PY'
          import os
          keys = [
              "NAVER_CLIENT_ID",
              "NAVER_CLIENT_SECRET",
              "SUPABASE_URL",
              "SUPABASE_KEY",
              "OPENAI_API_KEY",
          ]
          for k in keys:
              print(f"{k}: {'OK' if os.getenv(k) else 'MISSING'}")
          PY

      - name: Run curation script
        run: python agent_test.py