name: Judo Place Curation Agent

on:
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install crewai supabase

      - name: Run Agent
        # 소희님의 Secrets 이름과 1:1로 매칭했습니다.
        env:
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          DB_URL: "${{ secrets.SUPABASE_URL }}"
          DB_KEY: "${{ secrets.SUPABASE_KEY }}"
          CREWAI_TELEMETRY_OPT_OUT: "true"
          PYTHONUNBUFFERED: "1"
        run: python agent_test.py